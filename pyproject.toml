[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybernest-security-scanner"
version = "1.0.0b1"
description = "A local-first Python dependency security scanner."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "packaging>=23.0",
    "pip-audit>=2.10,<3",
]

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
cybernest = "cybernest.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cybernest*"]
exclude = ["tests*", "src*"]
